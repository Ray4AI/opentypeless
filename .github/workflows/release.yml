name: Release

# Pushing a version tag (e.g. v0.2.0) builds Windows + Linux installers and
# attaches them to a GitHub Release. Trigger manually from the Actions tab to
# build without publishing (artifacts stay on the run for download).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build and release (e.g. v0.2.0)'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact_name: windows-x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact_name: linux-x64

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2

      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          case "${{ matrix.platform }}" in
            windows-latest)
              cp src-tauri/target/release/bundle/nsis/*.exe dist-release/ 2>/dev/null || true
              cp src-tauri/target/release/bundle/msi/*.msi dist-release/ 2>/dev/null || true
              ;;
            ubuntu-latest)
              cp src-tauri/target/release/bundle/appimage/*.AppImage dist-release/ 2>/dev/null || true
              cp src-tauri/target/release/bundle/deb/*.deb dist-release/ 2>/dev/null || true
              ;;
          esac
          ls -la dist-release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact_name }}
          path: dist-release/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
